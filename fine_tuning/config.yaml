# QLoRA fine-tuning config for Qwen3-4B on jupyter-agent-dataset
# Run: uv run --extra train python fine_tuning/train.py

model:
  name: Qwen/Qwen3-4B
  trust_remote_code: true
  torch_dtype: bfloat16

lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM

bnb:                        # 4-bit quantisation
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

data:
  dataset_id: jupyter-agent/jupyter-agent-dataset
  train_split: train
  val_split: validation
  sample_size: 10000        # subset from 95.8k
  seed: 42
  max_seq_length: 4096
  # columns expected in the dataset
  input_col:  context       # notebook context + query
  output_col: code_cell     # verified code cell

training:
  output_dir: checkpoints/qwen3-4b-ds-agent
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4   # effective batch = 16
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  fp16: false
  bf16: true
  logging_steps: 50
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 200
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  report_to: wandb
  run_name: qwen3-4b-ds-agent-qlora
  dataloader_num_workers: 4
  group_by_length: true       # speeds up training by reducing padding
