[project]
name = "ds-notebook-agent"
version = "0.1.0"
description = "LangGraph agentic pipeline for data science notebook assistance"
requires-python = ">=3.10"
dependencies = [
    # LangChain / LangGraph
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",          # OpenAI-compat client → points at local vllm
    "langchain-core>=0.3",
    # API server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # Structured outputs
    "pydantic>=2.9",
    # Terminal UI
    "rich>=13.9",
    "prompt-toolkit>=3.0",
    # HTTP client (used by terminal UI → FastAPI)
    "httpx>=0.27",
    "httpx-sse>=0.4",
    # Utilities
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "anyio>=4.6",
    "vllm>=0.6; sys_platform == 'linux'",
    "mlx-lm>=0.19; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Data science execution stack — required by sandbox-executed generated code
    "pandas>=2.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "openpyxl>=3.1",
    "datasets>=4.8.5",
    "pyarrow>=24.0.0",
    "tensorflow>=2.21.0",
    "torch>=2.11.0",
    # DSCodeBench official-harness scoring (lightgbm problems; scikit-image for
    # plot-comparison parity). PIL ships with the stack already.
    "lightgbm>=4.5",
    "scikit-image>=0.25",
]

[project.optional-dependencies]
# Install only on GPU nodes for fine-tuning
train = [
    "transformers>=4.45",
    "peft>=0.14",
    "trl>=0.11",
    "datasets>=3.0",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
    "torch>=2.4",
    "wandb>=0.18",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.11",
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
]

[project.scripts]
agent-api   = "src.api.main:main"
agent-ui    = "src.ui.terminal:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
